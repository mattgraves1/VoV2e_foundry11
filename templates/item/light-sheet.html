<form class="{{cssClass}}" autocomplete="off">
    <header class="sheet-header">
        <img class="profile-img" src="{{item.img}}" data-edit="img" title="{{item.name}}"/>
        <div class="header-fields">
            <h1 class="charname"><input name="name" type="text" value="{{item.name}}" placeholder="Name"/></h1>
            <div class="grid grid-2col">
              <div class="resource">
                <label class="resource-label">Duration</label>
                  <input type="text" name="system.duration" value="{{data.system.duration}}" data-dtype="Number"/>
              </div>
              <div class="resource">
                <label class="resource-label">Quantity</label>
                  <input type="text" name="system.quantity" value="{{data.system.quantity}}" data-dtype="Number"/>
              </div>              
              <div class="resource">
                <label class="resource-label">Slots</label>
                  <input type="text" name="system.slots" value="{{data.system.slots}}" data-dtype="Number"/>
              </div>
              <div class="resource">
                <label title="Made of metal: rust, corrosion, magnets and metal-eaters can reach it. Set from the book when the item is made; tick or untick it for anything made by hand."><input type="checkbox" name="system.metal" {{checked data.system.metal}}/> Metal</label>
              </div>
              <div class="resource">
                <label class="resource-label">Units per Slot</label>
                  <input type="text" class="units-per-slot" value="{{unitsPerSlot}}" placeholder="—" title="How many of this fit in one item slot. Writes Slots (3 = 0.33). Blank: the stack costs its Slots value whole."/>
              </div>
              <div class="resource">
                <label class="resource-label">{{valueLabel}}</label>
                  <input type="text" name="system.tradeValue" value="{{data.system.tradeValue}}" data-dtype="Number"/>
                  {{#if conditionalValue}}
                    <div class="conditional-trade-value">{{conditionalValue.value}} to {{conditionalValue.buyer}}</div>
                  {{/if}}
              </div>
            </div>
        </div>
    </header>

    {{!-- Sheet Tab Navigation --}}
    <nav class="sheet-tabs tabs" data-group="primary">
        <a class="item" data-tab="description">Description</a>        
    </nav>

    {{!-- Sheet Body --}}
    <section class="sheet-body">
        {{!-- Description Tab --}}
        <div class="tab" data-group="primary" data-tab="description">
            {{editor content=data.system.description target="system.description" button=true owner=owner editable=editable}}
        </div>        
    </section>
</form>
